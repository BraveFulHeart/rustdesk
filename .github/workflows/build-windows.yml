name: Build Windows Client

on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  VERSION: "1.5.3"

jobs:
  generate-bridge:
    name: Generate Flutter Bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.75
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps and fetch packages
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          rustup component add rustfmt || true
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          mkdir -p ./flutter/ios/Runner ./flutter/macos/Runner
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-windows-x64:
    name: Build RustDesk Windows x64
    needs: [generate-bridge]
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Verify restored bridge files
        shell: pwsh
        run: |
          Write-Host "Verifying bridge files:"
          Get-ChildItem -Path ./flutter/lib -Filter "*bridge*" | Select-Object Name, Length
          Get-ChildItem -Path ./src -Filter "*bridge*" | Select-Object Name, Length

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build WindowInjection (TopMostWindow)
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
            cd RustDeskTempTopMostWindow
            git checkout ecd8d6a139eee76845ea66423fb739af450fda90
            $sdk = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\include" | Where-Object { $_.Name -like "10.*" } | Sort-Object Name -Descending | Select-Object -First 1).Name
            Write-Host "Detected Windows SDK: $sdk"
            if ($sdk) {
              msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 -p:WindowsTargetPlatformVersion=$sdk
            } else {
              msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64
            }
          } catch {
            Write-Host "TopMostWindow build skipped: $_"
          }

      - name: Install LLVM and Clang
        shell: pwsh
        run: |
          if (Get-Command clang.exe -ErrorAction SilentlyContinue) {
            Write-Host "clang.exe already available in PATH"
          } elseif (Test-Path "C:\Program Files\LLVM\bin\clang.exe") {
            Write-Host "Found pre-installed LLVM at C:\Program Files\LLVM"
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
            "LLVM_PATH=C:\Program Files\LLVM" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "Installing LLVM via Chocolatey..."
            choco install llvm -y --no-progress
            "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
            "LLVM_PATH=C:\Program Files\LLVM" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          clang --version

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          $flutterRoot = "${{ steps.flutter.outputs['CACHE-PATH'] }}"
          if (-not $flutterRoot) {
            $flutterRoot = (Get-Command flutter).Source | Split-Path | Split-Path
          }
          Write-Host "Detected Flutter root: $flutterRoot"
          # Download custom flutter engine (API direct download with fallback)
          $engineDownloaded = $false
          try {
            Write-Host "Downloading flutter engine via GitHub API..."
            $h = @{ "Accept" = "application/octet-stream"; "User-Agent" = "CI" }
            if ($env:GH_TOKEN) { $h["Authorization"] = "Bearer $env:GH_TOKEN" }
            Invoke-WebRequest -Uri "https://api.github.com/repos/rustdesk/engine/releases/assets/210168939" -Headers $h -OutFile "windows-x64-release.zip" -MaximumRedirection 5 -TimeoutSec 180
            if ((Test-Path "windows-x64-release.zip") -and ((Get-Item "windows-x64-release.zip").Length -gt 1000000)) {
              $engineDownloaded = $true
              Write-Host "Successfully downloaded flutter engine via API"
            }
          } catch {
            Write-Host "API download notice: $_"
          }
          if (-not $engineDownloaded) {
            Write-Host "Fallback: Downloading from release URL..."
            for ($i = 1; $i -le 3; $i++) {
              try {
                Invoke-WebRequest -Uri "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip" -OutFile "windows-x64-release.zip" -TimeoutSec 180
                if ((Test-Path "windows-x64-release.zip") -and ((Get-Item "windows-x64-release.zip").Length -gt 1000000)) {
                  $engineDownloaded = $true
                  break
                }
              } catch {
                Write-Host "Attempt $i failed: $_"
                Start-Sleep -Seconds 5
              }
            }
          }
          if (-not $engineDownloaded) {
            throw "Failed to download custom flutter engine"
          }
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $targetEngineDir = "$flutterRoot\bin\cache\artifacts\engine\windows-x64-release"
          New-Item -ItemType Directory -Force -Path $targetEngineDir
          Copy-Item -Path "windows-x64-release\*" -Destination $targetEngineDir -Recurse -Force
          Write-Host "Custom flutter engine installed successfully to $targetEngineDir"

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Cache vcpkg installed packages and downloads
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
          key: windows-2022-vcpkg-deps-${{ env.VCPKG_COMMIT_ID }}
          restore-keys: |
            windows-2022-vcpkg-deps-

      - name: Setup vcpkg with binary cache
        shell: pwsh
        run: |
          $vcpkgDir = "C:\vcpkg"
          if (-not (Test-Path "$vcpkgDir\.git")) {
            Write-Host "Cloning vcpkg..."
            git clone https://github.com/microsoft/vcpkg.git $vcpkgDir
          }
          Set-Location $vcpkgDir
          git fetch origin
          git checkout ${{ env.VCPKG_COMMIT_ID }}

          $authHeader = @{ "Accept" = "application/octet-stream"; "User-Agent" = "CI" }
          if ($env:GH_TOKEN) {
            $authHeader["Authorization"] = "Bearer $env:GH_TOKEN"
          }

          # 1. Download vcpkg.exe directly via GitHub API
          if (-not (Test-Path "$vcpkgDir\vcpkg.exe")) {
            $downloaded = $false
            $versionTag = "2026-07-27"
            if (Test-Path "$vcpkgDir\scripts\vcpkg-tool-metadata.txt") {
              $meta = ConvertFrom-StringData (Get-Content "$vcpkgDir\scripts\vcpkg-tool-metadata.txt" -Raw)
              if ($meta.VCPKG_TOOL_RELEASE_TAG) {
                $versionTag = $meta.VCPKG_TOOL_RELEASE_TAG
              }
            }
            Write-Host "Required vcpkg-tool release tag: $versionTag"

            try {
              Write-Host "Fetching vcpkg asset ID via GitHub API..."
              $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/vcpkg-tool/releases/tags/$versionTag" -Headers $authHeader
              $asset = $rel.assets | Where-Object { $_.name -eq "vcpkg.exe" } | Select-Object -First 1
              if ($asset) {
                Write-Host "Downloading vcpkg.exe (Asset ID: $($asset.id))..."
                Invoke-WebRequest -Uri "https://api.github.com/repos/microsoft/vcpkg-tool/releases/assets/$($asset.id)" -Headers $authHeader -OutFile "$vcpkgDir\vcpkg.exe" -MaximumRedirection 5 -TimeoutSec 120
                if ((Test-Path "$vcpkgDir\vcpkg.exe") -and ((Get-Item "$vcpkgDir\vcpkg.exe").Length -gt 1000000)) {
                  $downloaded = $true
                  Write-Host "Successfully downloaded vcpkg.exe via API"
                }
              }
            } catch {
              Write-Host "API asset lookup/download failed: $_"
            }

            if (-not $downloaded) {
              for ($i = 1; $i -le 3; $i++) {
                try {
                  Write-Host "Attempt $i - Downloading directly from release URL..."
                  Invoke-WebRequest -Uri "https://github.com/microsoft/vcpkg-tool/releases/download/$versionTag/vcpkg.exe" -OutFile "$vcpkgDir\vcpkg.exe" -TimeoutSec 120
                  if ((Test-Path "$vcpkgDir\vcpkg.exe") -and ((Get-Item "$vcpkgDir\vcpkg.exe").Length -gt 1000000)) {
                    $downloaded = $true
                    break
                  }
                } catch {
                  Write-Host "Attempt $i failed: $_"
                  Start-Sleep -Seconds 3
                }
              }
            }

            if (-not $downloaded) {
              Write-Host "Running bootstrap-vcpkg.bat as last resort..."
              .\bootstrap-vcpkg.bat -disableMetrics
            }
          }

          Set-Content -Value "" -Path "$vcpkgDir\vcpkg.disable-metrics" -Force -ErrorAction SilentlyContinue
          .\vcpkg.exe version

          # 2. Pre-cache vcpkg build tools (Ninja, CMake) into downloads/ to prevent CDN 502/504 errors
          New-Item -ItemType Directory -Force -Path "$vcpkgDir\downloads" | Out-Null

          # Pre-cache Ninja 1.13.2
          $ninjaFile = "$vcpkgDir\downloads\ninja-win-1.13.2.zip"
          if (-not (Test-Path $ninjaFile)) {
            Write-Host "Pre-downloading Ninja 1.13.2 via API..."
            try {
              Invoke-WebRequest -Uri "https://api.github.com/repos/ninja-build/ninja/releases/assets/318863577" -Headers $authHeader -OutFile $ninjaFile -MaximumRedirection 5 -TimeoutSec 60
              Write-Host "Successfully pre-downloaded Ninja 1.13.2"
            } catch {
              Write-Host "Ninja API download fallback: $_"
              Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip" -OutFile $ninjaFile -TimeoutSec 60 -ErrorAction SilentlyContinue
            }
          }

          # Pre-cache CMake 4.4.0
          $cmakeFile = "$vcpkgDir\downloads\cmake-4.4.0-windows-x86_64.zip"
          if (-not (Test-Path $cmakeFile)) {
            Write-Host "Pre-downloading CMake 4.4.0 via API..."
            try {
              Invoke-WebRequest -Uri "https://api.github.com/repos/Kitware/CMake/releases/assets/471629612" -Headers $authHeader -OutFile $cmakeFile -MaximumRedirection 5 -TimeoutSec 120
              Write-Host "Successfully pre-downloaded CMake 4.4.0"
            } catch {
              Write-Host "CMake API download fallback: $_"
              Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v4.4.0/cmake-4.4.0-windows-x86_64.zip" -OutFile $cmakeFile -TimeoutSec 120 -ErrorAction SilentlyContinue
            }
          }

          # 3. Pre-cache GitHub source tarballs to prevent 504 Gateway Timeouts during compilation
          $archives = @(
            @{ name = "pkgconf-pkgconf-pkgconf-3.0.3.tar.gz"; url = "https://github.com/pkgconf/pkgconf/archive/pkgconf-3.0.3.tar.gz" },
            @{ name = "webmproject-libvpx-v1.16.0.tar.gz"; url = "https://github.com/webmproject/libvpx/archive/v1.16.0.tar.gz" },
            @{ name = "xiph-opus-v1.5.2.tar.gz"; url = "https://github.com/xiph/opus/archive/v1.5.2.tar.gz" }
          )

          foreach ($a in $archives) {
            $targetPath = "$vcpkgDir\downloads\$($a.name)"
            if (-not (Test-Path $targetPath)) {
              Write-Host "Pre-downloading source archive $($a.name)..."
              for ($i = 1; $i -le 3; $i++) {
                try {
                  Invoke-WebRequest -Uri $a.url -Headers $authHeader -OutFile $targetPath -MaximumRedirection 5 -TimeoutSec 180
                  if ((Test-Path $targetPath) -and ((Get-Item $targetPath).Length -gt 10000)) {
                    Write-Host "Successfully pre-downloaded $($a.name)"
                    break
                  }
                } catch {
                  Write-Host "Attempt $i failed for $($a.name) - $_"
                  Start-Sleep -Seconds 3
                }
              }
            }
          }

          # Pre-fetch tools so vcpkg extracts and caches them immediately
          Write-Host "Warming up vcpkg tools cache..."
          .\vcpkg.exe fetch ninja
          .\vcpkg.exe fetch cmake

          "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RUNVCPKG_VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$vcpkgDir" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-x64-windows-static-rel-out.log" || true
        shell: bash

      - name: Inject Custom Server and Branding
        shell: pwsh
        run: |
          python3 ./.github/scripts/inject_config.py

      - name: Build RustDesk
        shell: pwsh
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          Move-Item -Path ./flutter/build/windows/x64/runner/Release -Destination ./rustdesk -Force
          Move-Item -Path "./rustdesk/rustdesk.exe" -Destination "./rustdesk/YuleLink.exe" -Force
          # Download usbmmidd_v2 (API direct download with fallback)
          $usbDownloaded = $false
          try {
            Write-Host "Downloading usbmmidd_v2 via GitHub API..."
            $h = @{ "Accept" = "application/octet-stream"; "User-Agent" = "CI" }
            if ($env:GH_TOKEN) { $h["Authorization"] = "Bearer $env:GH_TOKEN" }
            Invoke-WebRequest -Uri "https://api.github.com/repos/rustdesk-org/rdev/releases/assets/180784412" -Headers $h -OutFile "usbmmidd_v2.zip" -MaximumRedirection 5 -TimeoutSec 60
            if ((Test-Path "usbmmidd_v2.zip") -and ((Get-Item "usbmmidd_v2.zip").Length -gt 10000)) {
              $usbDownloaded = $true
              Write-Host "Successfully downloaded usbmmidd_v2 via API"
            }
          } catch {
            Write-Host "API download notice: $_"
          }
          if (-not $usbDownloaded) {
            for ($i = 1; $i -le 3; $i++) {
              try {
                Invoke-WebRequest -Uri "https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip" -OutFile "usbmmidd_v2.zip" -TimeoutSec 60
                if ((Test-Path "usbmmidd_v2.zip") -and ((Get-Item "usbmmidd_v2.zip").Length -gt 10000)) {
                  $usbDownloaded = $true
                  break
                }
              } catch {
                Write-Host "Attempt $i failed: $_"
                Start-Sleep -Seconds 3
              }
            }
          }
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat" -Force -ErrorAction SilentlyContinue
          Move-Item -Path .\usbmmidd_v2 -Destination ./rustdesk -Force

      - name: Copy WindowInjection DLL if built
        shell: pwsh
        run: |
          if (Test-Path "RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll") {
            Copy-Item "RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll" -Destination "./rustdesk" -Force
            Write-Host "WindowInjection.dll copied into ./rustdesk"
          }

      - name: Build self-extracted portable executable
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -n 1);
          if [ "$runner_res" != "" ]; then
            cp "$runner_res" ./libs/portable/Runner.res;
          fi
          sed -i '/dpiAware/d' res/manifest.xml || true
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/YuleLink.exe
          popd
          mkdir -p ./dist
          cp ./target/release/rustdesk-portable-packer.exe "./dist/YuleLink-${{ env.VERSION }}-x86_64.exe"

      - name: Upload YuleLink Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: YuleLink-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
