name: Build Windows Client

on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  VERSION: "1.5.0"

jobs:
  generate-bridge:
    name: Generate Flutter Bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.75

      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --locked
          cargo install cargo-expand --version 1.0.95 --locked

      - name: Generate bridge
        run: |
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart

  build-windows-x64:
    name: Build RustDesk Windows x64
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build WindowInjection (TopMostWindow)
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow
            cd RustDeskTempTopMostWindow
            git checkout ecd8d6a139eee76845ea66423fb739af450fda90
            $sdk = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\include" | Where-Object { $_.Name -like "10.*" } | Sort-Object Name -Descending | Select-Object -First 1).Name
            Write-Host "Detected Windows SDK: $sdk"
            if ($sdk) {
              msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64 -p:WindowsTargetPlatformVersion=$sdk
            } else {
              msbuild WindowInjection/WindowInjection.vcxproj -p:Configuration=Release -p:Platform=x64
            }
          } catch {
            Write-Host "TopMostWindow build skipped: $_"
          }

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
        shell: bash

      - name: Inject Custom Server and Branding
        shell: pwsh
        run: |
          # === [INJECTED BY RUSTDESK CUSTOMIZER] ===
          $cfg = ".\libs\hbb_common\src\config.rs"
          if (Test-Path $cfg) {
              $raw = Get-Content $cfg -Raw
              $raw = $raw -replace 'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[".*?"\];', 'pub const RENDEZVOUS_SERVERS: &[&str] = &["x9ragj8s4ydxv89f7m-rustdesk.yulelink.com"];'
              $raw = $raw -replace 'pub const RS_PUB_KEY: &str = ".*?";', 'pub const RS_PUB_KEY: &str = "s2J6JDCuo1yTevpB2unpJwYdhIYnd9Qq79dEogH7cGQ=";'
              $raw = $raw -replace 'pub static ref APP_NAME: RwLock<String> = RwLock::new\(".*?"\.to_owned\(\)\);', 'pub static ref APP_NAME: RwLock<String> = RwLock::new("YuleLink".to_owned());'
              Set-Content -Path $cfg -Value $raw -NoNewline
              Write-Host "[CI] Custom server and branding successfully injected!"
          }
          # =========================================

      - name: Build RustDesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Copy WindowInjection DLL if built
        shell: pwsh
        run: |
          if (Test-Path "RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll") {
            Copy-Item "RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll" -Destination "./rustdesk" -Force
            Write-Host "WindowInjection.dll copied into ./rustdesk"
          }

      - name: Upload RustDesk Windows Executable
        uses: actions/upload-artifact@v4
        with:
          name: RustDesk-Windows-x64
          path: rustdesk
